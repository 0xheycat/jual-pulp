<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Swap PULP</title>
<style>body{margin:0;background:#07080b;color:#fff;font-family:-apple-system,sans-serif}main{max-width:420px;margin:0 auto;padding:28px 16px}button{border:0;border-radius:12px;padding:14px;font-weight:700} .tabs{display:flex;gap:8px} .tabs button{flex:1;background:#1c1f27;color:#ddd} .tabs button.on{background:#ff37c7;color:#1a0b14} .action{width:100%;margin-top:12px;background:#ff37c7;color:#1a0b14;font-size:16px} .card{background:#14161c;border-radius:16px;padding:14px} input{width:100%;background:transparent;border:0;color:#fff;font-size:28px;outline:none} #log{margin-top:12px;background:#101218;border-radius:12px;padding:12px;min-height:56px;white-space:pre-wrap}</style>
</head>
<body>
<main>
<h1>Swap PULP</h1>
<p>Router V2. Kalau approval sudah ada, langsung swap.</p>
<div class="tabs"><button id="tabSell" class="on" type="button">Jual</button><button id="tabBuy" type="button">Beli</button></div>
<div class="card"><input id="amount" value="83365"><p id="bal">Saldo: -</p></div>
<p id="quote">Estimasi: -</p>
<button id="go" class="action" type="button">Connect MetaMask</button>
<div id="log">Cek allowance dulu, tidak approve ulang.</div>
</main>
<script>
const TOKEN="0x170867335fc4eeff6c2b4d07de6fc8b4f57048d0",ROUTER="0x89e5DB8B5aA49aA85AC63f691524311AEB649eba",WETH="0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73",RPC="https://rpc.mainnet.chain.robinhood.com",CHAIN="0x1237";
let mode="sell",account=null,allowed=false;
const log=m=>document.getElementById("log").textContent=String(m);
const pad=h=>h.toLowerCase().replace(/^0x/,"").padStart(64,"0");
const word=n=>BigInt(n).toString(16).padStart(64,"0");
function parseAmount(t){const [a,b=""]=String(t).trim().split(".");return BigInt(a||"0")*10n**18n+BigInt((b+"000000000000000000").slice(0,18))}
function fmt(n){const v=Number(n)/1e18;return Number.isFinite(v)?v.toFixed(v<1?6:2):"-"}
async function rpc(method,params){const r=await fetch(RPC,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({jsonrpc:"2.0",id:1,method,params})});const d=await r.json();if(d.error)throw new Error(d.error.message);return d.result}
async function allowance(amount){if(!account)return 0n;return BigInt(await rpc("eth_call",[{to:TOKEN,data:"0xdd62ed3e"+pad(account)+pad(ROUTER)},"latest"]))} 
async function refresh(){if(!account)return;const amount=parseAmount(document.getElementById("amount").value);if(mode==="sell"){const bal=BigInt(await rpc("eth_call",[{to:TOKEN,data:"0x70a08231"+pad(account)},"latest"]));document.getElementById("bal").textContent="Saldo PULP: "+fmt(bal);const alw=await allowance(amount);allowed=alw>=amount;document.getElementById("go").textContent=allowed?"Jual, tanpa approve":"Approve lalu jual";log(allowed?"Approval V2 sudah cukup. Tinggal swap.":"Approval belum cukup.")}else{const bal=BigInt(await rpc("eth_getBalance",[account,"latest"]));document.getElementById("bal").textContent="Saldo ETH: "+fmt(bal);document.getElementById("go").textContent="Beli PULP"}}
async function quote(){try{const amount=parseAmount(document.getElementById("amount").value);const path=mode==="sell"?[TOKEN,WETH]:[WETH,TOKEN];const data="0xd06ca61f"+word(amount)+word(64)+word(2)+pad(path[0])+pad(path[1]);const out=await rpc("eth_call",[{to:ROUTER,data},"latest"]);const second=BigInt("0x"+out.slice(2+64*2,2+64*3));document.getElementById("quote").textContent="Estimasi "+fmt(second)+(mode==="sell"?" ETH":" PULP")}catch(e){document.getElementById("quote").textContent="Estimasi gagal"}}
async function send(tx){return window.ethereum.request({method:"eth_sendTransaction",params:[tx]})}
async function wait(hash){for(let i=0;i<40;i++){const rec=await rpc("eth_getTransactionReceipt",[hash]);if(rec){if(rec.status==="0x0")throw new Error("gagal "+hash);return}await new Promise(r=>setTimeout(r,1500))}throw new Error("pending "+hash)}
document.getElementById("tabSell").onclick=()=>{mode="sell";document.getElementById("tabSell").className="on";document.getElementById("tabBuy").className="";document.getElementById("amount").value="83365";refresh();quote()};
document.getElementById("tabBuy").onclick=()=>{mode="buy";document.getElementById("tabBuy").className="on";document.getElementById("tabSell").className="";document.getElementById("amount").value="0.001";refresh();quote()};
document.getElementById("amount").oninput=()=>{refresh();quote()};
document.getElementById("go").onclick=async()=>{try{if(!window.ethereum){log("Buka di browser MetaMask");return}try{await window.ethereum.request({method:"wallet_switchEthereumChain",params:[{chainId:CHAIN}]})}catch(e){if(e.code===4902)await window.ethereum.request({method:"wallet_addEthereumChain",params:[{chainId:CHAIN,chainName:"Robinhood Chain",nativeCurrency:{name:"ETH",symbol:"ETH",decimals:18},rpcUrls:[RPC],blockExplorerUrls:["https://robinhoodchain.blockscout.com"]}]});else throw e}if(!account){account=(await window.ethereum.request({method:"eth_requestAccounts"}))[0];await refresh();log("Terhubung "+account);return}const amount=parseAmount(document.getElementById("amount").value);const deadline=BigInt(Math.floor(Date.now()/1000)+1800);if(mode==="sell"){const alw=await allowance(amount);if(alw<amount){log("Approve sekali...");const a=await send({from:account,to:TOKEN,data:"0x095ea7b3"+pad(ROUTER)+word(amount),value:"0x0"});await wait(a)}log("Swap jual...");const data="0x791ac947"+word(amount)+word(1)+word(160)+pad(account)+word(deadline)+word(2)+pad(TOKEN)+pad(WETH);const hash=await send({from:account,to:ROUTER,data,value:"0x0"});await wait(hash);log("Jual sukses "+hash)}else{log("Swap beli...");const data="0xb6f9de95"+word(1)+word(128)+pad(account)+word(deadline)+word(2)+pad(WETH)+pad(TOKEN);const hash=await send({from:account,to:ROUTER,data,value:"0x"+amount.toString(16)});await wait(hash);log("Beli sukses "+hash)}await refresh()}catch(e){log(e.message||e)}};
quote();
</script>
</body></html>
