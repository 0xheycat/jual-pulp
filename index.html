<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jual PULP</title>
<style>body{margin:0;background:#07080b;color:#fff;font-family:-apple-system,sans-serif}main{max-width:420px;margin:0 auto;padding:28px 16px}button{width:100%;border:0;border-radius:12px;padding:14px;font-weight:700;background:#ff37c7;color:#1a0b14;font-size:16px}.card{background:#14161c;border-radius:16px;padding:14px}#log{margin-top:12px;background:#101218;border-radius:12px;padding:12px;white-space:pre-wrap}</style></head>
<body><main><h1>Jual PULP</h1><p>Satu popup. Fungsi swap mengembalikan jumlah ETH, jadi MetaMask tidak membuangnya.</p><div class="card"><p>Jumlah: 83365 PULP</p><p id="quote">Harga: -</p></div><button id="go" type="button">Jual sekarang</button><div id="log">Approval sudah cukup. Tidak ada approve lagi.</div></main>
<script>
const TOKEN="0x170867335fc4eeff6c2b4d07de6fc8b4f57048d0",ROUTER="0x89e5DB8B5aA49aA85AC63f691524311AEB649eba",WETH="0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73",RPC="https://rpc.mainnet.chain.robinhood.com",CHAIN="0x1237";
const log=m=>document.getElementById("log").textContent=String(m);
const pad=h=>h.toLowerCase().replace(/^0x/,"").padStart(64,"0");
const word=n=>BigInt(n).toString(16).padStart(64,"0");
async function rpc(method,params){const r=await fetch(RPC,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({jsonrpc:"2.0",id:1,method,params})});const d=await r.json();if(d.error)throw new Error(d.error.message||JSON.stringify(d.error));return d.result}
document.getElementById("go").onclick=async()=>{try{if(!window.ethereum){log("Buka link ini di browser MetaMask");return}try{await window.ethereum.request({method:"wallet_switchEthereumChain",params:[{chainId:CHAIN}]})}catch(e){if(e.code===4902)await window.ethereum.request({method:"wallet_addEthereumChain",params:[{chainId:CHAIN,chainName:"Robinhood Chain",nativeCurrency:{name:"ETH",symbol:"ETH",decimals:18},rpcUrls:[RPC],blockExplorerUrls:["https://robinhoodchain.blockscout.com"]}]});else throw e}const account=(await window.ethereum.request({method:"eth_requestAccounts"}))[0];const amount=83365n*10n**18n;const min=10n**15n;const deadline=BigInt(Math.floor(Date.now()/1000)+1800);const data="0x18cbafe5"+word(amount)+word(min)+word(160)+pad(account)+word(deadline)+word(2)+pad(TOKEN)+pad(WETH);const out=await rpc("eth_call",[{from:account,to:ROUTER,data},"latest"]);const body=out.slice(2);let last=0n;for(let i=0;i<body.length;i+=64)last=BigInt("0x"+(body.slice(i,i+64)||"0"));document.getElementById("quote").textContent="Simulasi lolos, dapat "+(Number(last)/1e18).toFixed(6)+" ETH";log("Confirm satu popup ini.");const hash=await window.ethereum.request({method:"eth_sendTransaction",params:[{from:account,to:ROUTER,data,value:"0x0"}]});log("Terkirim "+hash)}catch(e){log(e.message||e)}};
</script></body></html>
